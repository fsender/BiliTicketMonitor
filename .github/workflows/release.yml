name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '3.0.0'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            artifact: BiliTicketMonitor-linux-x86_64
            cmake: -DCMAKE_BUILD_TYPE=Release
            binary: build/bin/BiliTicketMonitor

          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            artifact: BiliTicketMonitor-linux-arm64
            cmake: -DCMAKE_BUILD_TYPE=Release
            binary: build/bin/BiliTicketMonitor

          - name: macOS Apple Silicon
            runner: macos-14
            artifact: BiliTicketMonitor-macos-arm64
            cmake: -DCMAKE_BUILD_TYPE=Release
            binary: build/bin/BiliTicketMonitor

          - name: Windows x86_64
            runner: windows-2022
            artifact: BiliTicketMonitor-win-x86_64.exe
            cmake: -DCMAKE_BUILD_TYPE=Release -DSTATIC_BUILD=ON -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            binary: build/bin/Release/BiliTicketMonitor.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev cmake g++

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install curl cmake

      - name: Install deps (Windows)
        if: runner.os == 'Windows'
        run: |
          $v = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          # 禁止 vcpkg 下载 cmake（使用 runner 自带的）
          $env:VCPKG_MAX_CONCURRENCY = $env:NUMBER_OF_PROCESSORS
          & "$v\vcpkg" install curl:x64-windows-static --no-downloads
          echo "VCPKG_ROOT=$v" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -S src -B build ${{ matrix.cmake }}

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: ${{ matrix.binary }} --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: ${{ matrix.binary }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release
        run: |
          mkdir -p release_files
          for d in artifacts/*/; do
            p=$(basename "$d"); pc="${p%.exe}"
            ext=""; case "$p" in *win*) ext=".exe" ;; esac
            cp "$d"/* "release_files/${pc}${ext}"
          done
          echo "## BiliTicketMonitor ${{ github.ref_name }}" > notes.md
          echo "" >> notes.md
          echo "### Downloads" >> notes.md
          echo "" >> notes.md
          for f in release_files/*; do echo "- \`$(basename $f)\` ($(ls -lh $f | awk '{print $5}'))" >> notes.md; done
          cat CHANGELOG.md >> notes.md 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: release_files/*
