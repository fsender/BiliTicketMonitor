name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '3.0.0'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            container: amd64/alpine:latest
            artifact: BiliTicketMonitor-linux-x86_64
            binary: build/bin/BiliTicketMonitor

          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            container: arm64v8/alpine:latest
            artifact: BiliTicketMonitor-linux-arm64
            binary: build/bin/BiliTicketMonitor

          - name: macOS Apple Silicon
            runner: macos-14
            container: null
            artifact: BiliTicketMonitor-macos-arm64
            binary: build/bin/BiliTicketMonitor

          - name: Windows x86_64
            runner: windows-2022
            container: null
            artifact: BiliTicketMonitor-win-x86_64.exe
            binary: build/bin/Release/BiliTicketMonitor.exe

    steps:
      - uses: actions/checkout@v4

      # === 全静态构建 (Alpine Linux — musl) ===
      - name: Build (Alpine static)
        if: matrix.container
        run: |
          apk add --no-cache curl-dev curl-static cmake g++ build-base linux-headers \
            openssl-libs-static nghttp2-static nghttp3-static zlib-static brotli-static zstd-static \
            libidn2-static libpsl-static libunistring-static c-ares-dev
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DSTATIC_BUILD=ON
          cmake --build build
          build/bin/BiliTicketMonitor --version

      # === macOS (动态链接系统库, macOS 标准做法) ===
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install curl cmake

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: ${{ matrix.binary }} --version

      # === Windows (vcpkg 静态链接 curl) ===
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT"
          if (-not $vcpkg) { $vcpkg = "C:\vcpkg" }
          & "$vcpkg\vcpkg" install curl:x64-windows
          echo "VCPKG_ROOT=$vcpkg" >> $env:GITHUB_ENV

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: ${{ matrix.binary }} --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files (rename with platform names)
        run: |
          mkdir -p release_files
          for dir in artifacts/*/; do
            platform=$(basename "$dir")
            platform_clean="${platform%.exe}"
            for f in "$dir"*; do
              ext=""
              case "$platform" in
                *win*) ext=".exe" ;;
              esac
              cp "$f" "release_files/${platform_clean}${ext}"
            done
          done
          echo "=== Release files ==="
          ls -lh release_files/

      - name: Generate release notes
        run: |
          echo "## BiliTicketMonitor ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "### Downloads" >> release-notes.md
          echo "" >> release-notes.md
          for f in release_files/*; do
            name=$(basename "$f")
            size=$(ls -lh "$f" | awk '{print $5}')
            echo "- \`$name\` ($size)" >> release-notes.md
          done
          echo "" >> release-notes.md
          cat CHANGELOG.md >> release-notes.md 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release_files/*